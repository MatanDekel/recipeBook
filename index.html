<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ספר המתכונים של עדן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Assistant:wght@300;400;500;600;700&family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EE;
    --paper-deep:#F2E9D8;
    --ink:#3A2E27;
    --ink-soft:#6B5D52;
    --accent:#8C3B3B;
    --accent-deep:#6E2C2C;
    --tan:#C9A98C;
    --gold:#B08D3D;
    --sage:#7C8B6F;
    --spine-shadow: rgba(58,46,39,0.18);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    height:100%;
    background:var(--paper-deep);
    color:var(--ink);
    font-family:'Assistant', sans-serif;
  }

  body{
    display:flex;
    min-height:100vh;
  }

  /* ---------- Sidebar / Table of contents ---------- */
  .toc{
    width:280px;
    min-width:280px;
    background:var(--ink);
    color:var(--paper);
    padding:36px 24px;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
    box-shadow: -8px 0 24px var(--spine-shadow) inset;
  }

  .toc-brand{
    background:none;
    border:none;
    text-align:right;
    cursor:pointer;
    padding:0;
    margin:0 0 28px;
    color:inherit;
  }

  .toc h1{
    font-family:'Frank Ruhl Libre', serif;
    font-size:1.5rem;
    font-weight:700;
    margin:0 0 4px;
    color:var(--paper);
  }

  .toc .sub{
    font-size:0.8rem;
    color:var(--tan);
    margin:0;
    letter-spacing:0.02em;
  }

  .toc-list{
    list-style:none;
    margin:0;
    padding:0;
    flex:1;
  }

  .toc-category{
    font-family:'Heebo', sans-serif;
    font-size:0.7rem;
    letter-spacing:0.08em;
    color:var(--gold);
    margin:20px 8px 6px;
    text-transform:uppercase;
  }
  .toc-category:first-child{ margin-top:0; }

  .toc-item{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    background:none;
    border:none;
    color:var(--paper);
    font-family:'Assistant', sans-serif;
    font-size:0.95rem;
    text-align:right;
    padding:10px 8px;
    border-radius:6px;
    cursor:pointer;
    opacity:0.7;
    transition:opacity 0.2s ease, background 0.2s ease;
  }

  .toc-item:hover{ opacity:1; background:rgba(255,255,255,0.06); }

  .toc-item.active{
    opacity:1;
    background:rgba(255,255,255,0.1);
    box-shadow: inset 3px 0 0 var(--gold);
  }

  .toc-num{
    font-family:'Heebo', sans-serif;
    font-size:0.75rem;
    color:var(--gold);
    min-width:22px;
  }

  .toc-footer{
    margin-top:24px;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,0.15);
  }

  .print-btn{
    width:100%;
    background:var(--accent);
    color:var(--paper);
    border:none;
    padding:12px 14px;
    border-radius:8px;
    font-family:'Assistant', sans-serif;
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
    transition:background 0.2s ease;
  }
  .print-btn:hover{ background:var(--accent-deep); }
  .print-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .hint{
    font-size:0.72rem;
    color:var(--tan);
    margin:10px 2px 0;
    line-height:1.5;
  }

  /* ---------- Main page area ---------- */
  main{
    flex:1;
    padding:56px 64px;
    display:flex;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.5), transparent 40%),
      var(--paper);
    position:relative;
  }

  main::before{
    content:"";
    position:absolute;
    top:0; bottom:0; right:0;
    width:18px;
    background:linear-gradient(to left, var(--spine-shadow), transparent);
    pointer-events:none;
  }

  .page{
    max-width:720px;
    width:100%;
  }

  .recipe{ display:none; animation: pageIn 0.35s ease; }
  .recipe.active{ display:block; }

  @keyframes pageIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- Cover / table of contents page ---------- */
  .cover{ display:none; animation: pageIn 0.35s ease; }
  .cover.active{ display:block; }

  .cover-title{
    font-family:'Frank Ruhl Libre', serif;
    font-size:3rem;
    font-weight:900;
    margin:0 0 6px;
    color:var(--accent-deep);
  }

  .cover-sub{
    font-size:1rem;
    color:var(--ink-soft);
    margin:0 0 48px;
  }

  .toc-section{ margin-bottom:36px; }

  .toc-section h3{
    font-family:'Frank Ruhl Libre', serif;
    font-size:1.15rem;
    font-weight:700;
    color:var(--sage);
    margin:0 0 16px;
  }

  .toc-entries{
    list-style:none;
    margin:0;
    padding:0;
  }

  .toc-entry{
    width:100%;
    background:none;
    border:none;
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:11px 2px;
    cursor:pointer;
    font-family:'Assistant', sans-serif;
    font-size:1.02rem;
    color:var(--ink);
    text-align:right;
    text-decoration:none;
    border-bottom:1px solid var(--paper-deep);
    transition:color 0.2s ease;
  }
  .toc-entry:hover{ color:var(--accent-deep); }

  .toc-entry .e-num{
    font-family:'Heebo', sans-serif;
    font-size:0.8rem;
    color:var(--gold);
    min-width:24px;
  }

  .toc-entry .e-leader{
    flex:1;
    border-bottom:1px dotted var(--tan);
    height:1px;
    align-self:center;
  }

  .toc-entry .e-title{ flex-shrink:0; }

  .chapter-num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:44px;
    height:44px;
    border-radius:50%;
    border:1.5px solid var(--gold);
    color:var(--gold);
    font-family:'Heebo', sans-serif;
    font-size:1rem;
    font-weight:600;
    margin-bottom:18px;
  }

  .back-to-list{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:var(--ink-soft);
    font-family:'Assistant', sans-serif;
    font-size:0.85rem;
    cursor:pointer;
    padding:0;
    margin-bottom:18px;
    transition:color 0.2s ease;
  }
  .back-to-list:hover{ color:var(--accent-deep); }

  .recipe h2{
    font-family:'Frank Ruhl Libre', serif;
    font-size:2.4rem;
    font-weight:700;
    margin:0 0 10px;
    line-height:1.15;
  }

  .prep-time{
    display:inline-block;
    font-family:'Assistant', sans-serif;
    font-size:0.85rem;
    color:var(--accent-deep);
    background:var(--paper-deep);
    border-radius:6px;
    padding:5px 12px;
    margin:0 0 16px;
  }

  .meta-row{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin-bottom:36px;
    font-size:0.9rem;
    color:var(--ink-soft);
  }

  .meta-row span{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }

  .meta-row .dot{
    width:5px; height:5px; border-radius:50%; background:var(--sage);
  }

  .divider{
    border:none;
    height:1px;
    background:repeating-linear-gradient(to left, var(--tan) 0 6px, transparent 6px 12px);
    margin:0 0 32px;
  }

  .cols{
    display:grid;
    grid-template-columns: 1fr 1.5fr;
    gap:44px;
  }

  .cols.single{
    grid-template-columns: 1fr;
    max-width:420px;
  }

  .block h3{
    font-family:'Frank Ruhl Libre', serif;
    font-size:1.1rem;
    font-weight:700;
    color:var(--accent-deep);
    margin:0 0 14px;
  }

  .ingredients{
    list-style:none;
    margin:0;
    padding:0;
  }

  .ingredients li{
    padding:8px 0;
    border-bottom:1px dashed var(--tan);
    font-size:0.94rem;
    display:flex;
    gap:8px;
  }
  .ingredients li:last-child{ border-bottom:none; }

  .ingredients .amt{
    font-family:'Heebo', sans-serif;
    color:var(--accent-deep);
    font-weight:600;
    white-space:nowrap;
  }

  .steps{
    margin:0;
    padding:0;
    list-style:none;
    counter-reset:step;
  }

  .steps li{
    counter-increment:step;
    position:relative;
    padding-right:38px;
    margin-bottom:20px;
    font-size:0.97rem;
    line-height:1.65;
  }

  .steps li::before{
    content: counter(step);
    position:absolute;
    right:0;
    top:1px;
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--accent);
    color:var(--paper);
    font-family:'Heebo', sans-serif;
    font-size:0.8rem;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .notes{
    margin-top:36px;
    padding:18px 20px;
    background:var(--paper-deep);
    border-radius:10px;
    border-inline-start: 3px solid var(--sage);
  }

  .notes h3{
    font-family:'Frank Ruhl Libre', serif;
    font-size:1rem;
    color:var(--sage);
    margin:0 0 10px;
  }

  .notes ul{
    margin:0;
    padding-inline-start:18px;
    font-size:0.88rem;
    line-height:1.7;
    color:var(--ink-soft);
  }

  .page-nav{
    display:flex;
    justify-content:space-between;
    margin-top:48px;
    padding-top:20px;
    border-top:1px solid var(--tan);
  }

  .page-nav button{
    background:none;
    border:none;
    font-family:'Assistant', sans-serif;
    font-size:0.9rem;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:color 0.2s ease;
  }
  .page-nav button:hover:not(:disabled){ color:var(--accent-deep); }
  .page-nav button:disabled{ opacity:0.25; cursor:default; }

  @media (max-width: 760px){
    body{ flex-direction:column; }
    .toc{ width:100%; min-width:0; height:auto; position:relative; padding:24px; }
    main{ padding:32px 20px; }
    .cols{ grid-template-columns:1fr; gap:28px; }
    .recipe h2{ font-size:1.9rem; }
  }

  /* ---------- Print (PDF export) ---------- */
  /* ---------- Login / signup overlay ---------- */
  .auth-overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    background:var(--paper-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .auth-card{
    background:var(--paper);
    border-radius:16px;
    padding:40px 36px;
    max-width:380px;
    width:100%;
    box-shadow:0 20px 60px rgba(58,46,39,0.25);
  }

  .auth-title{
    font-family:'Frank Ruhl Libre', serif;
    font-size:1.6rem;
    font-weight:700;
    margin:0 0 6px;
    color:var(--accent-deep);
    text-align:center;
  }

  .auth-sub{
    font-size:0.85rem;
    color:var(--ink-soft);
    text-align:center;
    margin:0 0 28px;
  }

  .auth-tabs{
    display:flex;
    margin-bottom:24px;
    border-bottom:1px solid var(--tan);
  }

  .auth-tab{
    flex:1;
    background:none;
    border:none;
    padding:10px;
    font-family:'Assistant', sans-serif;
    font-size:0.95rem;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }

  .auth-tab.active{
    color:var(--accent-deep);
    border-bottom-color:var(--accent-deep);
    font-weight:600;
  }

  .auth-form{
    display:none;
    flex-direction:column;
    gap:14px;
  }

  .auth-form.active{ display:flex; }

  .auth-form input{
    padding:11px 14px;
    border:1px solid var(--tan);
    border-radius:8px;
    font-family:'Assistant', sans-serif;
    font-size:0.95rem;
    background:var(--paper);
    color:var(--ink);
  }

  .auth-form input:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }

  .auth-submit{
    background:var(--accent);
    color:var(--paper);
    border:none;
    padding:12px;
    border-radius:8px;
    font-family:'Assistant', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
    margin-top:6px;
    transition:background 0.2s ease;
  }
  .auth-submit:hover{ background:var(--accent-deep); }

  .auth-error{
    color:var(--accent-deep);
    font-size:0.82rem;
    text-align:center;
    min-height:1.2em;
    margin:14px 0 0;
  }

  body.auth-locked nav.toc,
  body.auth-locked main{
    display:none;
  }

  .user-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:14px 0 0;
    font-size:0.78rem;
    color:var(--tan);
  }

  .logout-link{
    background:none;
    border:none;
    color:var(--tan);
    font-size:0.78rem;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .logout-link:hover{ color:var(--paper); }

  @media print{
    .auth-overlay{ display:none !important; }
    body.auth-locked nav.toc,
    body.auth-locked main{ display:initial; }
    .toc{ display:none; }
    main{ padding:0; box-shadow:none; }
    main::before{ display:none; }
    body{ display:block; }
    .cover{ display:block !important; page-break-after:always; animation:none; }
    .recipe{ display:block !important; page-break-after:always; animation:none; }
    .recipe:last-child{ page-break-after:auto; }
    .toc-entry{ cursor:default; }
    .toc-entry, .toc-entry:visited{ color:var(--ink); text-decoration:none; }
    .page-nav{ display:none; }
    .back-to-list{ display:none; }
    .page{ max-width:100%; }

    /* Tighter type + spacing so most recipes fit a single printed page */
    .recipe{ font-size:0.8em; }
    .chapter-num{ width:32px; height:32px; font-size:0.8rem; margin-bottom:8px; }
    .recipe h2{ font-size:1.5rem; margin-bottom:4px; }
    .prep-time{ font-size:0.7rem; padding:3px 8px; margin-bottom:10px; }
    .meta-row{ margin-bottom:14px; font-size:0.8rem; }
    .divider{ margin-bottom:16px; }
    .cols{ gap:24px; }
    .block h3{ font-size:0.95rem; margin-bottom:8px; }
    .ingredients li{ padding:4px 0; font-size:0.82rem; }
    .steps li{ margin-bottom:8px; padding-right:26px; font-size:0.82rem; line-height:1.4; }
    .steps li::before{ width:18px; height:18px; font-size:0.65rem; }
    .notes{ margin-top:16px; padding:10px 14px; }
    .notes h3{ font-size:0.85rem; margin-bottom:6px; }
    .notes ul{ font-size:0.76rem; }
    .cover-title{ font-size:2rem; }
    .cover-sub{ margin-bottom:24px; }
    .toc-section{ margin-bottom:18px; }
    .toc-entry{ padding:6px 2px; font-size:0.85rem; }
  }
</style>
</head>
<body>

  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <h2 class="auth-title">ספר המתכונים</h2>
      <p class="auth-sub">כניסה לספר המתכונים המשפחתי</p>
      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTabBtn" onclick="showAuthTab('login')">התחברות</button>
        <button class="auth-tab" id="signupTabBtn" onclick="showAuthTab('signup')">הרשמה</button>
      </div>
      <form class="auth-form active" id="loginForm" onsubmit="return handleLogin(event)">
        <input type="text" id="loginUsername" placeholder="שם משתמש" autocomplete="username" required>
        <input type="password" id="loginPassword" placeholder="סיסמה" autocomplete="current-password" required>
        <button type="submit" class="auth-submit">כניסה</button>
      </form>
      <form class="auth-form" id="signupForm" onsubmit="return handleSignup(event)">
        <input type="text" id="signupUsername" placeholder="בחרו שם משתמש" autocomplete="username" required>
        <input type="password" id="signupPassword" placeholder="בחרו סיסמה" autocomplete="new-password" required>
        <button type="submit" class="auth-submit">הרשמה וכניסה</button>
      </form>
      <p class="auth-error" id="authError"></p>
    </div>
  </div>

  <nav class="toc" aria-label="תוכן עניינים">
    <button class="toc-brand" onclick="showToc()">
      <h1>ספר המתכונים</h1>
      <p class="sub">של עדן</p>
    </button>
    <ul class="toc-list" id="tocList"></ul>
    <div class="toc-footer">
      <button class="print-btn" onclick="window.print()">🖨️ ייצוא ל-PDF / הדפסה</button>
      <p class="hint">בהדפסה יופיעו כל המתכונים, כל אחד בעמוד נפרד. בחלון ההדפסה אפשר לבחור "שמור כ-PDF".</p>
      <p class="user-row"><span id="currentUserLabel"></span> <button class="logout-link" onclick="handleLogout()">התנתקות</button></p>
    </div>
  </nav>

  <main>
    <div class="page" id="pageContent"></div>
  </main>

<script>
  const recipes = [
    {
      title: "עוגיות שוקולד צ'יפס גדולות",
      category: "קינוחים",
      time: "כ-30 דקות",
      yield: "10-12 עוגיות גדולות (או 20-22 קטנות)",
      ingredients: [
        { amt: "100 גרם", name: "חמאה רכה (ר' הערות לגרסה פרווה)" },
        { amt: "125 גרם (1/2 כוס)", name: "סוכר חום כהה" },
        { amt: "30 גרם (3 כפות)", name: "סוכר" },
        { amt: "1/2 כפית", name: "מלח" },
        { amt: "1 כפית", name: "תמצית וניל" },
        { amt: "1", name: "ביצה L" },
        { amt: "1/4 כפית", name: "סודה לשתייה" },
        { amt: "1/2 כפית", name: "אבקת אפייה" },
        { amt: "210 גרם (כוס וחצי)", name: "קמח (ר' הערות לגרסה ללא גלוטן)" },
        { amt: "200 גרם", name: "שוקולד מריר קצוץ או שוקולד צ'יפס" },
      ],
      steps: [
        "מחממים תנור ל-170 מעלות.",
        "בקערת מיקסר עם וו גיטרה (אפשר גם עם מיקסר ידני חשמלי!) שמים חמאה, סוכר חום כהה, סוכר, מלח ווניל ומערבלים במהירות גבוהה עד שמתקבלת תערובת במרקם קרמי רך.",
        "מוסיפים ביצה וממשיכים לערבל עד שהיא נטמעת בתערובת.",
        "מוסיפים סודה, אבקת אפייה וקמח ומערבלים עד שמתקבלים גושי בצק גדולים.",
        "אם משתמשים בשוקולד צ'יפס – מוסיפים פנימה ומערבלים עד לפיזור אחיד של חתיכות השוקולד בבצק. אם משתמשים בשוקולד רגיל – קוצצים לחתיכות גסות בעזרת סכין. שומרים חלק מהשוקולד בצד.",
        "יוצרים 10-12 עיגולים מהבצק ומניחים במרווחים על גבי תבנית תנור מרופדת בנייר אפייה. מקשטים את החלק העליון בעוד קצת שוקולד.",
        "אופים במשך 12-17 דקות או עד שהעוגיות תופחות ומזהיבות. אם מכינים עוגיות קטנות יותר, זמן האפייה מתקצר.",
        "מצננים מעט בטמפרטורת החדר ומגישים.",
      ],
      notes: [
        "העוגיות נשמרות בצנצנת אטומה עד שבוע.",
        "אפשר להקפיא את העוגיות עד חודש. מומלץ לחמם אותן קצת לפני ההגשה.",

  function pad(n){ return String(n+1).padStart(2,'0'); }

  function groupByCategory(){
    const groups = {};
    recipes.forEach((r,i) => {
      const cat = r.category || 'שונות';
      if(!groups[cat]) groups[cat] = [];
      groups[cat].push(i);
    });
    return groups;
  }

  function renderToc(){
    const list = document.getElementById('tocList');
    const groups = groupByCategory();
    list.innerHTML = Object.keys(groups).map(cat => `
      <p class="toc-category">${cat}</p>
      ${groups[cat].map(i => `
        <li>
          <button class="toc-item ${i===current?'active':''}" onclick="showRecipe(${i})">
            <span class="toc-num">${pad(i)}</span>
            <span>${recipes[i].title}</span>
          </button>
        </li>
      `).join('')}
    `).join('');
  }

  function renderCover(){
    const groups = groupByCategory();
    return `
      <section class="cover ${current==='toc'?'active':''}">
        <h2 class="cover-title">ספר המתכונים</h2>
        <p class="cover-sub">של עדן — תוכן העניינים</p>
        ${Object.keys(groups).map(cat => `
          <div class="toc-section">
            <h3>${cat}</h3>
            <ul class="toc-entries">
              ${groups[cat].map(i => `
                <li>
                  <a class="toc-entry" href="#recipe-${i}" onclick="showRecipe(${i}); return false;">
                    <span class="e-num">${pad(i)}</span>
                    <span class="e-title">${recipes[i].title}</span>
                    <span class="e-leader"></span>
                  </a>
                </li>
              `).join('')}
            </ul>
          </div>
        `).join('')}
      </section>
    `;
  }

  function renderPage(){
    const container = document.getElementById('pageContent');
    container.innerHTML = renderCover() + recipes.map((r,i) => `
      <article class="recipe ${i===current?'active':''}" data-index="${i}" id="recipe-${i}">
        <button class="back-to-list" onclick="showToc()">→ חזרה לתוכן העניינים</button>
        <div class="chapter-num">${pad(i)}</div>
        <h2>${r.title}</h2>
        ${r.time ? `<p class="prep-time">⏱ זמן הכנה כולל: ${r.time}</p>` : ''}
        <div class="meta-row">
          <span>🍽️ ${r.yield}</span>
        </div>
        <hr class="divider">
        <div class="cols ${r.steps && r.steps.length ? '' : 'single'}">
          <div class="block">
            <h3>מצרכים</h3>
            <ul class="ingredients">
              ${r.ingredients.map(ing => `<li><span class="amt">${ing.amt}</span><span>${ing.name}</span></li>`).join('')}
            </ul>
          </div>
          ${r.steps && r.steps.length ? `
          <div class="block">
            <h3>אופן ההכנה</h3>
            <ol class="steps">
              ${r.steps.map(s => `<li>${s}</li>`).join('')}
            </ol>
          </div>` : ''}
        </div>
        ${r.notes && r.notes.length ? `
          <div class="notes">
            <h3>הערות, הארות ותוספות</h3>
            <ul>${r.notes.map(n => `<li>${n}</li>`).join('')}</ul>
          </div>` : ''}
        <div class="page-nav">
          <button onclick="showRecipe(${i-1})" ${i===0?'disabled':''}>→ הקודם</button>
          <button onclick="showRecipe(${i+1})" ${i===recipes.length-1?'disabled':''}>הבא ←</button>
        </div>
      </article>
    `).join('');
  }

  function showRecipe(i){
    if(i < 0 || i >= recipes.length) return;
    current = i;
    renderToc();
    renderPage();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function showToc(){
    current = 'toc';
    renderToc();
    renderPage();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  /* ---------- Simple login / signup (no server - stored in this browser only) ---------- */
  const AUTH_USERS_KEY = 'recipebook_users';
  const AUTH_CURRENT_KEY = 'recipebook_currentUser';

  function loadUsers(){
    try{
      const raw = localStorage.getItem(AUTH_USERS_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }

  function saveUsers(users){
    try{ localStorage.setItem(AUTH_USERS_KEY, JSON.stringify(users)); }catch(e){}
  }

  function showAuthTab(tab){
    document.getElementById('loginForm').classList.toggle('active', tab === 'login');
    document.getElementById('signupForm').classList.toggle('active', tab === 'signup');
    document.getElementById('loginTabBtn').classList.toggle('active', tab === 'login');
    document.getElementById('signupTabBtn').classList.toggle('active', tab === 'signup');
    document.getElementById('authError').textContent = '';
  }

  function handleSignup(e){
    e.preventDefault();
    const username = document.getElementById('signupUsername').value.trim();
    const password = document.getElementById('signupPassword').value;
    const errorEl = document.getElementById('authError');
    if(!username || !password){
      errorEl.textContent = 'צריך למלא שם משתמש וסיסמה';
      return false;
    }
    const users = loadUsers();
    if(users[username]){
      errorEl.textContent = 'שם המשתמש הזה כבר קיים - אפשר להתחבר איתו';
      return false;
    }
    users[username] = password;
    saveUsers(users);
    try{ localStorage.setItem(AUTH_CURRENT_KEY, username); }catch(e){}
    checkAuth();
    return false;
  }

  function handleLogin(e){
    e.preventDefault();
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorEl = document.getElementById('authError');
    const users = loadUsers();
    if(!users[username] || users[username] !== password){
      errorEl.textContent = 'שם משתמש או סיסמה שגויים';
      return false;
    }
    try{ localStorage.setItem(AUTH_CURRENT_KEY, username); }catch(e){}
    checkAuth();
    return false;
  }

  function handleLogout(){
    try{ localStorage.removeItem(AUTH_CURRENT_KEY); }catch(e){}
    checkAuth();
  }

  function checkAuth(){
    const overlay = document.getElementById('authOverlay');
    let current = null;
    try{ current = localStorage.getItem(AUTH_CURRENT_KEY); }
    catch(e){
      // Storage blocked (e.g. sandboxed preview) - don't lock the person out, just skip the gate.
      document.body.classList.remove('auth-locked');
      overlay.style.display = 'none';
      return;
    }
    if(current){
      document.body.classList.remove('auth-locked');
      overlay.style.display = 'none';
      document.getElementById('currentUserLabel').textContent = 'שלום, ' + current;
    } else {
      document.body.classList.add('auth-locked');
      overlay.style.display = 'flex';
    }
  }

  checkAuth();
  renderToc();
  renderPage();
</script>

</body>
</html>
